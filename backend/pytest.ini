; Phase 0 — pytest configuration for the SNM Portal backend.
;
; Scope: unit tests of pure helpers + service-layer functions that don't
; need a database. DB-backed integration tests will arrive once we have
; a sqlite-in-memory or test-DB fixture (Phase 0 follow-up).
;
; Run from backend/:   pytest
;                      pytest --cov=app --cov-report=term-missing
;                      pytest tests/unit -q

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:passlib.*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: pure-function tests, no DB or HTTP
    integration: tests that need a live DB connection
    slow: tests that take >1s
